[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heckler"
version = "0.1.0"
description = "Simulated red-team / evaluation agents that stress-test a deployed LLM agent against its own system prompt."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "anthropic>=1.0",
  "openai>=1.50",
  # Scenario taxonomy + generation. Pinned to a commit: Simula is pre-1.0 and not on PyPI.
  "simula @ git+https://github.com/Mercity-AI/Simula.git@c27f83b930422dc04b936a883d4cc83b299c29f9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
heckler = "heckler.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
